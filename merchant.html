                document.body.innerHTML = '<h1>🚫 Access Denied</h1><p>Ecological Symbiosis Lock Activated.</p>';
                window.stop();
                throw new Error("Domain locked.");
            }
            
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('keydown', function(e) {
                if (e.keyCode === 123 || 
                   (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
                   (e.ctrlKey && e.keyCode === 85)) {
                    e.preventDefault();
                    return false;
                }
            });
        })();
    </script>

        // --- NEW: Reliable real-time shipments listener for merchants ---
        function loadShipments() {
            try {
                if (window.merchantShipmentsUnsub) { window.merchantShipmentsUnsub(); window.merchantShipmentsUnsub = null; }

                const shipmentsCol = collection(db, "shipments");
                const q = query(shipmentsCol, where("merchantEmail", "==", merchantEmail));

                window.merchantShipmentsUnsub = onSnapshot(q, (snap) => {
                    const body = document.getElementById('tableBody');
                    let html = "";
                    window.loadedShipmentsData = {};
                    let total = 0, totalAmount = 0;
                    let rows = [];

                    snap.forEach(docSnap => {
                        const d = docSnap.data();
                        const id = docSnap.id;
                        if (d && d.deleted) return; // ignore deleted
                        rows.push({ id, ...d });
                    });

                    // sort by timestamp (desc) if present, otherwise keep snapshot order
                    rows.sort((a,b) => {
                        const ta = a.timestamp ? (a.timestamp.seconds || 0) : 0;
                        const tb = b.timestamp ? (b.timestamp.seconds || 0) : 0;
                        return tb - ta;
                    });

                    rows.forEach(d => {
                        const id = d.id;
                        window.loadedShipmentsData[id] = d;
                        total++;
                        totalAmount += Number(d.amount || 0);

                        const awb = d.awb || ("AXN" + id.substring(0,5).toUpperCase());
                        html += `<tr>
                            <td class="awb-badge">${awb}</td>
                            <td>${d.name || '-'}</td>
                            <td dir="ltr">${d.phone || '-'}</td>
                            <td>${d.city || '-'}</td>
                            <td style="color:var(--primary-burgundy); font-weight:900;">${d.amount || 0} ج.م</td>
                            <td>${d.status || '-'}</td>
                            <td><button class="track-btn" onclick="window.openTrack('${id}')">تتبع</button></td>
                        </tr>`;
                    });

                    if (body) body.innerHTML = html;
                    const tsEl = document.getElementById('totalShipments');
                    const tmEl = document.getElementById('totalMoney');
                    if (tsEl) tsEl.innerText = total;
                    if (tmEl) tmEl.innerText = totalAmount + " ج.م";
                }, (err) => { console.error('shipments listener error', err); });
            } catch (e) {
                console.error('loadShipments error', e);
            }
        }

        // rest of original functions (logout, chat, etc.) - keep as in original file

        onAuthStateChanged(auth, async (user) => {
            isAuthChecked = true;
            if (user) {
                localStorage.setItem('axon_merchant_remember', 'yes');
                document.getElementById('authLoading').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                
                merchantEmail = user.email;
                merchantName = merchantEmail.split('@')[0];
                document.getElementById('merchantEmailDisplay').innerHTML = `مرحباً بك: ${merchantName} <i class="fa-solid fa-bolt" style="color:#ffc107;"></i>`;

                // existing onSnapshot listeners for merchant_profiles and settings

                startGlobalChatListener();
                loadShipments();
                loadMerchantRadar();
            } else {
                const remembered = localStorage.getItem('axon_merchant_remember');
                if (remembered === 'yes') {
                    setTimeout(() => {
                        if(!auth.currentUser) {
                            localStorage.removeItem('axon_merchant_remember');
                            window.location.href = "index.html";
                        }
                    }, 2500);
                } else {
                    window.location.href = "index.html";
                }
            }
        });
