    <script>
        window.onerror = function(msg, url, line, col, error) {
            document.body.innerHTML += `<div style="position:fixed;top:0;left:0;width:100%;background:#800020;color:white;z-index:999999;padding:20px;text-align:left;direction:ltr;font-family:monospace;box-shadow:0 4px 10px rgba(0,0,0,0.5);">
                <h3 style="margin-top:0;color:#E1E715;">🚨 System Error Detected:</h3>
                <p><b>Message:</b> ${msg}</p>
                <p><b>Location:</b> Line ${line}, Col ${col}</p>
                <p style="font-size:12px;background:#111;padding:10px;border-radius:5px;"><b>Stack:</b><br>${error ? error.stack : 'N/A'}</p>
            </div>`;
            return false;
        };
        window.addEventListener("unhandledrejection", function(event) {
            document.body.innerHTML += `<div style="position:fixed;bottom:0;left:0;width:100%;background:#800020;color:white;z-index:999999;padding:20px;text-align:left;direction:ltr;font-family:monospace;box-shadow:0 -4px 10px rgba(0,0,0,0.5);">
                <h3 style="margin-top:0;color:#E1E715;">🚨 Firebase / Promise Error:</h3>
                <p><b>Reason:</b> ${event.reason}</p>
            </div>`;
        });
    </script>

            apiKey: "AIzaSyBuGdQQZ2lDu73W7wP3na45rlhiMXjaqGw",
            authDomain: "axon-express-2f534.firebaseapp.com",
            projectId: "axon-express-2f534",
            storageBucket: "axon-express-2f534.firebasestorage.app",
            messagingSenderId: "958528400260",
            appId: "1:958528400260:web:504ae94f3ef2225b928bd1"
        });
        
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence).catch(e => console.error("Persistence error:", e));
        const db = getFirestore(app);
        
        let merchantEmail = "", merchantName = "", merchantIP = "جاري التحقق...", merchantPhone = "غير مسجل", merchantAddress = "غير مسجل", branchName = "المركز الرئيسي";
        
        // --- 🛠️ اللوجيك المعدل والمحمي للتأكد من عدم حدوث Crash ---
        let isAuthChecked = false;

        onAuthStateChanged(auth, async (user) => {
            isAuthChecked = true;
            if (user) {
                localStorage.setItem('axon_merchant_remember', 'yes');
                document.getElementById('authLoading').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                
                // حماية إضافية لو اليوزر ملوش إيميل
                merchantEmail = user.email || "unknown@axon.com";
                merchantName = merchantEmail.split('@')[0];
                document.getElementById('merchantEmailDisplay').innerHTML = `مرحباً بك: ${merchantName} <i class="fa-solid fa-bolt" style="color:#ffc107;"></i>`;
                
                // استدعاء البيانات
                loadShipments();
                // بقية الفانكشنز شغالة في الخلفية...
            } else { 
                const remembered = localStorage.getItem('axon_merchant_remember');
                if (remembered === 'yes') {
                    setTimeout(() => {
                        if(!auth.currentUser) {
                            localStorage.removeItem('axon_merchant_remember');
                            window.location.href = "index.html";
                        }
                    }, 2500);
                } else {
                    window.location.href = "index.html";
                }
            }
        });

        // حماية عند استدعاء الشحنات وعرض التاريخ
        function loadShipments() {
            onSnapshot(query(collection(db, "shipments"), where("merchantEmail", "==", merchantEmail)), (snap) => {
                let total = 0, html = "", count = 0;
                let docs = [];
                snap.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
                
                // تعديل عملية الترتيب عشان تتوافق مع كل أنواع التواريخ القديمة والجديدة
                docs.sort((a, b) => {
                    let timeA = a.timestamp ? (a.timestamp.toMillis ? a.timestamp.toMillis() : new Date(a.timestamp).getTime()) : 0;
                    let timeB = b.timestamp ? (b.timestamp.toMillis ? b.timestamp.toMillis() : new Date(b.timestamp).getTime()) : 0;
                    return timeB - timeA;
                });

                docs.forEach(d => {
                    if(d.deleted) return;
                    total += Number(d.amount) || 0; count++;
                    const awb = d.awb || ("AXN" + d.id.substring(0,5).toUpperCase());
                    
                    // 🛠️ الحل الجذري لمشكلة التواريخ اللي كانت بتعمل Crash
                    let dateStr = "غير محدد";
                    try {
                        if (d.timestamp) {
                            let dateObj = d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp);
                            if (!isNaN(dateObj)) {
                                dateStr = dateObj.toLocaleString('ar-EG', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
                            }
                        }
                    } catch(e) { dateStr = "خطأ في التاريخ"; }

                    html += `<tr>
                        <td><span class="awb-badge">${awb}</span></td>
                        <td class="date-cell" dir="ltr">${dateStr}</td>
                        <td><b>${d.name}</b></td>
                        <td dir="ltr">${d.phone}</td>
                        <td>${d.city}</td>
                        <td style="color:var(--primary-burgundy); font-weight:bold;">${d.amount}</td>
                        <td style="font-weight:bold;">${d.status}</td>
                        <td><button class="print-btn" onclick="alert('جاري الطباعة')"><i class="fa-solid fa-print"></i> طباعة</button></td>
                    </tr>`;
                });
                document.getElementById('tableBody').innerHTML = html;
                document.getElementById('totalShipments').innerText = count;
                document.getElementById('totalMoney').innerText = total + " ج.م";
            });
        }
        
        window.logout = () => {
            localStorage.removeItem('axon_merchant_remember');
            signOut(auth).then(() => window.location.href = "index.html");
        };
    </script>
</body>
</html>
