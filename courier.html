<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axon Captain | رادار الأبطال</title>
    
    <link rel="manifest" href="manifest-captain.json">
    <meta name="theme-color" content="#1E3A8A">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        :root { 
            --primary-blue: #1E3A8A; 
            --secondary-blue: #2563EB;
            --primary-red: #D90429; 
            --bg-color: #F4F7F6; 
            --white: #ffffff; 
            --dark-text: #111827; 
            --soft-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.85);
        }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); margin: 0; color: var(--dark-text); overflow-x: hidden; transition: background 0.3s ease; padding-bottom: 90px; }
        
        .app-container { max-width: 600px; margin: 0 auto; background: var(--bg-color); min-height: 100vh; position: relative;}
        
        /* شاشة الدخول المايباخ */
        #loginSection { 
            background: linear-gradient(135deg, #0A192F, var(--primary-blue)); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 40px 30px; border-radius: 30px; 
            width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: fadeInUp 0.8s ease;
        }
        .login-card input {
            width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(255,255,255,0.1); color: white; font-family: 'Cairo'; font-size: 16px; text-align: center; transition: 0.3s;
        }
        .login-card input::placeholder { color: rgba(255,255,255,0.6); }
        .login-card input:focus { background: rgba(255,255,255,0.2); border-color: white; }
        .login-btn {
            width: 100%; background: linear-gradient(90deg, var(--primary-red), #ff3b3b); color: white; border: none; padding: 15px; 
            border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(217, 4, 41, 0.4);
        }
        .login-btn:active { transform: scale(0.95); }

        /* الهيدر الاحترافي */
        .app-header {
            background: var(--white); padding: 15px 25px; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--soft-shadow);
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; transition: background 0.3s;
        }
        .profile-area { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue)); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size:20px; box-shadow: 0 4px 10px rgba(30, 58, 138, 0.3);}
        .c-stars { color: #F59E0B; font-size: 12px; margin-top: 3px; letter-spacing: 2px;}
        .c-stars .empty-star { color: #E5E7EB; }

        /* شريط الحالة */
        .status-container {
            margin: 20px; background: var(--white); padding: 15px 25px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: var(--soft-shadow); transition: background 0.3s;
        }
        .status-badge { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size:16px;}
        .pulse-online { width: 14px; height: 14px; background: #10B981; border-radius: 50%; box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        .shift-btn { background: var(--primary-blue); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; font-family:'Cairo'; font-size:15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; }
        .shift-btn:active { transform: scale(0.95); }
        
        /* التابات السفلية العائمة */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px;
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 12px 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 25px; z-index: 1000; border: 1px solid rgba(255,255,255,0.2); transition: background 0.3s;
        }
        .nav-item {
            flex: 1; text-align: center; color: #9CA3AF; font-size: 12px; font-weight: 800; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
        }
        .nav-item i { font-size: 22px; transition: 0.3s; }
        .nav-item.active { color: var(--primary-blue); }
        .nav-item.active i { transform: translateY(-4px) scale(1.1); }
        .nav-item.active span { transform: translateY(-2px); }
        .nav-badge { position: absolute; top: -5px; right: 25px; background: var(--primary-red); color: white; border-radius: 50%; min-width: 18px; height: 18px; padding: 0 5px; font-size: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(217,4,41,0.4); display: none; font-weight: bold;}

        .page-tab { display: none; padding: 0 20px 20px 20px; animation: fadeInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .page-tab.active { display: block; }
        
        /* تصميم الكارت */
        .compact-card {
            background: var(--white); padding: 15px; border-radius: 20px; display: flex; align-items: center; 
            justify-content: space-between; box-shadow: var(--soft-shadow); margin-bottom: 15px; cursor: pointer;
            border-right: 5px solid var(--primary-blue); transition: all 0.3s ease; position: relative; overflow: visible;
        }
        .compact-card:active { transform: scale(0.97); }
        .card-icon { width: 50px; height: 50px; border-radius: 14px; background: #EEF2FF; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-left: 15px; flex-shrink: 0; transition: background 0.3s; position: relative;}
        .card-info { flex: 1; overflow: hidden;}
        .card-title { font-weight: 900; font-size: 16px; margin: 0; color: var(--dark-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px;}
        .card-sub { font-size: 13px; color: #6B7280; margin: 4px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;}
        .card-time { font-size: 11px; color: #9CA3AF; margin-top: 6px; display: flex; align-items: center; gap: 5px; font-weight: 600;}
        .card-price { font-weight: 900; color: var(--primary-red); font-size: 18px; text-align: left; white-space: nowrap; background: #FEF2F2; padding: 5px 10px; border-radius: 10px;}
        .card-dist { font-size: 11px; background: var(--primary-blue); color: white; padding: 3px 8px; border-radius: 8px; font-weight: bold;}

        /* الإشعار الخارجي على الطرد */
        .card-chat-badge {
            position: absolute; top: -8px; left: -8px; background: var(--primary-red); color: white; 
            min-width: 22px; height: 22px; border-radius: 50%; font-size: 11px; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; border: 2px solid var(--white); box-shadow: 0 3px 6px rgba(217,4,41,0.5); z-index: 10;
        }

        /* المودال */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); align-items: flex-end; justify-content: center; z-index: 2000; padding: 0;}
        .modal-content { background: var(--bg-color); padding: 30px 25px; border-top-left-radius: 30px; border-top-right-radius: 30px; width: 100%; max-width: 600px; position: relative; max-height: 92vh; overflow-y: auto; animation: slideUpSmooth 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.15);}
        
        .close-btn { position: absolute; top: 15px; left: 15px; background: rgba(217, 4, 41, 0.1); border: none; font-size: 20px; cursor: pointer; color: var(--primary-red); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 10;}
        .close-btn:active { transform: scale(0.9); background: rgba(217, 4, 41, 0.2); }
        
        .detail-box { background: var(--white); padding: 18px; border-radius: 20px; margin-bottom: 15px; box-shadow: var(--soft-shadow); border: 1px solid rgba(0,0,0,0.02);}
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;}
        .btn-u { padding: 14px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative;}
        .btn-u:active { transform: scale(0.96); }
        .btn-claim { background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue)); color: white; grid-column: span 2; font-size: 18px; box-shadow: 0 8px 20px rgba(30,58,138,0.3);}
        .btn-ignore { background: #FEF2F2; color: var(--primary-red); }
        .btn-nav { background: #EEF2FF; color: var(--primary-blue); }
        .btn-done { background: linear-gradient(135deg, #10B981, #059669); color: white; grid-column: span 2; font-size: 18px; box-shadow: 0 8px 20px rgba(16,185,129,0.3);}
        .btn-contact { background: #1F2937; color: white; grid-column: span 2; }
        
        .chat-notification-badge { position: absolute; top: -5px; right: -5px; background: var(--primary-red); color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(217,4,41,0.5); font-weight: bold; border: 2px solid white; display: none; }

        /* الشات */
        .chat-bubble { padding: 12px 18px; border-radius: 20px; max-width: 82%; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 10px; clear: both; font-weight: 600;}
        .chat-mine { background: #DCF8C6; float: left; border-bottom-left-radius: 5px; color: #000; }
        .chat-other { background: #ffffff; float: right; border-bottom-right-radius: 5px; color: #000; border: 1px solid #E5E7EB;}
        .chat-admin { background: #FEF2F2; float: right; border-bottom-right-radius: 5px; color: #D90429; border: 1px solid #FCA5A5; }

        body.dark-mode { --bg-color: #0F172A; --white: #1F2937; --dark-text: #F9FAFB; --soft-shadow: 0 10px 25px rgba(0,0,0,0.2); --glass-bg: rgba(31, 41, 55, 0.85); }
        body.dark-mode .app-container { background: #0F172A; }
        body.dark-mode .app-header, body.dark-mode .status-container { border: 1px solid #374151;}
        body.dark-mode .bottom-nav { border: 1px solid #374151; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);}
        body.dark-mode .compact-card, body.dark-mode .detail-box { background: #1E293B; border-color: #374151; border-right-color: var(--primary-blue);}
        body.dark-mode .card-icon { background: #0F172A; }
        body.dark-mode .card-sub { color: #9CA3AF; }
        body.dark-mode .card-price { background: #450a0a; }
        body.dark-mode .modal-content { background: #0F172A; border-top: 1px solid #374151;}
        body.dark-mode .chat-other { background: #374151; color: #fff; border-color: #4B5563;}
        body.dark-mode .close-btn { background: rgba(217, 4, 41, 0.2); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes slideUpSmooth { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInRight { from { transform: translateX(15px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .swal2-container { font-family: 'Cairo', sans-serif !important; z-index: 99999 !important; }
        
        #installPwaBtn {
            display: none; background: linear-gradient(135deg, #10B981, #059669); border: none; color: white; padding: 6px 15px; border-radius: 12px; font-family: 'Cairo'; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(16,185,129,0.3); animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-card">
            <h1 style="color:white; margin-bottom:5px; font-size:32px; letter-spacing:2px;">AXON</h1>
            <p style="color:rgba(255,255,255,0.8); font-size:15px; margin-bottom:30px; font-weight:bold;">Captain Tactical App</p>
            <input type="email" id="cUser" placeholder="البريد الإلكتروني (الإيميل كامل)">
            <input type="password" id="cPass" placeholder="كلمة السر">
            <button class="login-btn" id="loginBtn" onclick="window.loginCourier()">تسجيل الدخول</button>
        </div>
    </div>

    <div class="app-container" id="appContent" style="display:none;">
        <div class="app-header">
            <div class="profile-area">
                <div class="avatar" id="cInitials">AX</div>
                <div>
                    <div style="font-size:12px; color:gray; font-weight:800; text-transform:uppercase;">كابتن أكسون</div>
                    <div style="font-size:18px; font-weight:900; line-height:1.2; color:var(--dark-text);" id="cDisplayName">...</div>
                    <div class="c-stars" id="cStars"></div>
                </div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button id="installPwaBtn"><i class="fa-solid fa-download"></i> تثبيت</button>
                <button onclick="window.toggleTheme()" style="background:none; border:none; color:var(--primary-blue); font-size:24px; transition:0.3s;"><i class="fa-solid fa-moon"></i></button>
                <button onclick="window.logout()" style="background:none; border:none; color:var(--primary-red); font-size:22px; transition:0.3s;"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <div class="status-container">
            <div class="status-badge">
                <div id="statusDot" class=""></div>
                <span id="statusTxt">خارج الوردية</span>
            </div>
            <button id="shiftBtn" class="shift-btn" onclick="window.toggleShift()">بدء الوردية</button>
        </div>

        <div id="radarTab" class="page-tab active">
            <h3 style="margin-bottom:20px; color:var(--primary-blue); font-size:17px; display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-satellite-dish fa-beat"></i> القريب منك (الرادار)</h3>
            <div id="radarList">
                <p style="text-align:center; color:#9CA3AF; margin-top:40px; font-weight:bold; font-size:15px;">الرادار مغلق.. ابدأ الوردية يا بطل.</p>
            </div>
        </div>

        <div id="myTasksTab" class="page-tab">
            <h3 style="margin-bottom:20px; color:var(--primary-blue); font-size:17px; display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-motorcycle"></i> مهامي الحالية (مخطوفة)</h3>
            <div id="myTaskList">
                <p style="text-align:center; color:#9CA3AF; margin-top:40px; font-weight:bold; font-size:15px;">لا يوجد مهام رادار نشطة</p>
            </div>
        </div>

        <div id="manifestTab" class="page-tab">
            <h3 style="margin-bottom:20px; color:var(--primary-blue); font-size:17px; display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-file-invoice"></i> عهدة البوالص (المانيفست)</h3>
            <div id="manifestList">
                <p style="text-align:center; color:#9CA3AF; margin-top:40px; font-weight:bold; font-size:15px;">لم يتم تعيين بوالص لك اليوم.</p>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('radarTab', this)">
                <i class="fa-solid fa-satellite-dish"></i>
                <span>الرادار</span>
            </div>
            <div class="nav-item" onclick="switchTab('myTasksTab', this)">
                <span class="nav-badge" id="tasksBadge">0</span>
                <i class="fa-solid fa-motorcycle"></i>
                <span>مهامي</span>
            </div>
            <div class="nav-item" onclick="switchTab('manifestTab', this)">
                <span class="nav-badge" id="manifestBadge">0</span>
                <i class="fa-solid fa-boxes-packing"></i>
                <span>المانيفست</span>
            </div>
        </div>
    </div>

    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="msgSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

    <div id="orderDetailsModal" class="modal">
        <div class="modal-content" id="orderDetailsContent"></div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content" style="height: 88vh; padding:20px; background:var(--bg-color);">
            <button class="close-btn" onclick="window.closeChatModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="color:var(--primary-blue); margin-top:10px; border-bottom:2px solid var(--primary-red); padding-bottom:15px; text-align:center; font-size:18px;">
                <i class="fa-solid fa-comments"></i> محادثة: <span id="chatMerchantEmail">...</span>
            </h3>
            
            <div id="callMerchantBtnArea" style="margin-bottom: 15px;"></div>

            <div style="background: var(--white); border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; flex: 1; overflow: hidden; box-shadow:var(--soft-shadow);">
                <div id="chatBoxCourier" style="flex: 1; padding: 15px; overflow-y: auto; display: block; background:var(--bg-color);"></div>
                <div style="display: flex; border-top: 1px solid rgba(0,0,0,0.05); padding: 12px; background: var(--white);">
                    <input type="text" id="chatInputCourier" placeholder="اكتب رسالتك هنا..." style="flex: 1; padding: 15px; border: 1px solid #E5E7EB; border-radius: 15px; font-family: 'Cairo'; outline: none; font-weight:bold; font-size:14px; background:#F9FAFB;">
                    <button onclick="window.sendChatMessage()" style="background: #10B981; color: white; border: none; padding: 0 25px; border-radius: 15px; margin-right: 10px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; font-size:18px; transition:0.3s; box-shadow: 0 4px 10px rgba(16,185,129,0.3);"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc, addDoc, query, where, or } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const app = initializeApp({
            apiKey: "AIzaSyBuGdQQZ2lDu73W7wP3na45rlhiMXjaqGw",
            authDomain: "axon-express-2f534.firebaseapp.com",
            projectId: "axon-express-2f534",
            storageBucket: "axon-express-2f534.firebasestorage.app",
            messagingSenderId: "958528400260",
            appId: "1:958528400260:web:504ae94f3ef2225b928bd1"
        });
        
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentCaptain = "", currentCaptainId = "", isOnline = false, watchId = null, lat = null, lng = null, ignored = new Set();
        let notifiedTasks = new Set(); 
        let globalOrdersData = {}; 
        
        let currentChatMerchant = "";
        let chatUnsubscribe = null;
        let globalChatUnsubscribe = null;
        let wakeLock = null;
        let unreadMessagesByMerchant = {}; // عداد الرسايل المقروءة

        function formatTime(ts) {
            if(!ts) return "";
            let date = ts.toDate ? ts.toDate() : new Date(ts);
            return date.toLocaleString('ar-EG', { hour: '2-digit', minute:'2-digit', month:'short', day:'numeric' });
        }

        window.switchTab = (tabId, element) => {
            document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            if(navigator.vibrate) navigator.vibrate(50);
        };

        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) {}
            }
        };
        const releaseWakeLock = () => { if (wakeLock !== null) { wakeLock.release(); wakeLock = null; } };

        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        function resetLoginBtn() {
            const btn = document.getElementById('loginBtn');
            if(btn) { btn.innerHTML = 'تسجيل الدخول'; btn.disabled = false; }
        }

        // تحديث الإشعارات الخارجية على كروت الطرود في الشاشة الرئيسية
        window.updateOuterBadges = (merchantEmail) => {
            const count = unreadMessagesByMerchant[merchantEmail] || 0;
            // ندور على أي كارت بيحمل إيميل التاجر ده ونعدل النقطة الحمرا اللي عليه
            document.querySelectorAll(`.out-badge[data-merchant="${merchantEmail}"]`).forEach(el => {
                if(count > 0) {
                    el.innerText = count;
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const docSnap = await getDoc(doc(db, "couriers", user.uid));
                    if(docSnap.exists()) {
                        currentCaptain = docSnap.data().name || user.email.split('@')[0];
                        currentCaptainId = user.uid;
                        
                        let successCount = docSnap.data().successfulDeliveries || 0;
                        let starsHtml = ''; let filledStars = 3;
                        if (successCount >= 2000) filledStars = 5;
                        else if (successCount >= 1000) filledStars = 4;
                        for(let i=0; i<5; i++) {

                            else starsHtml += '<i class="fa-solid fa-star empty-star"></i> ';
                        }
                        document.getElementById('cStars').innerHTML = starsHtml;

                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('appContent').style.display = 'block';
                        document.getElementById('cDisplayName').innerText = currentCaptain;
                        document.getElementById('cInitials').innerText = currentCaptain.substring(0, 2).toUpperCase();
                        resetLoginBtn();
                        
                        startGlobalChatListener();
                        loadManifest(); 
                    } else {
                        await signOut(auth);
                        Swal.fire('مرفوض', 'هذا الإيميل غير مسجل ككابتن.', 'error');
                        resetLoginBtn();
                    }
                } catch(e) {
                    Swal.fire('خطأ أمني', 'قواعد الحماية أو الداتا فيها مشكلة: ' + e.message, 'error');
                    await signOut(auth);
                    resetLoginBtn();
                }
            } else {
                document.getElementById('loginSection').style.display = 'flex';
                document.getElementById('appContent').style.display = 'none';
                if(watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                if(globalChatUnsubscribe) { globalChatUnsubscribe(); globalChatUnsubscribe = null; }
                releaseWakeLock();
                resetLoginBtn();
            }
        });

        window.loginCourier = async () => {
            const btn = document.getElementById('loginBtn');
            const u = document.getElementById('cUser').value.trim();
            const p = document.getElementById('cPass').value;
            
            if(!u || !p) return Swal.fire('بيانات ناقصة', 'أدخل الإيميل كاملاً والباسورد', 'warning');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال...'; btn.disabled = true;

            try { 
                // Warmup للـ Audio بمجرد تدخل المستخدم
                const msgAudio = document.getElementById('msgSound');
                msgAudio.volume = 0; msgAudio.play().then(()=>{msgAudio.pause(); msgAudio.volume=1;}).catch(e=>{});
                
                await signInWithEmailAndPassword(auth, u, p); 
            } 
            catch(e) { resetLoginBtn(); Swal.fire('خطأ في الدخول', 'بيانات غير صحيحة.', 'error'); }
        };

        // --- 📡 المراقب الخلفي للرسايل والتنبيهات الصوتية ---
        function startGlobalChatListener() {
            if(globalChatUnsubscribe) globalChatUnsubscribe();
            
            const chatQ = query(collection(db, "internal_chats"), or(where("from", "==", currentCaptain), where("to", "==", currentCaptain)));
            let initialLoad = true;
            
            globalChatUnsubscribe = onSnapshot(chatQ, (snap) => {
                snap.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const msgData = change.doc.data();
                        
                        if(msgData.from !== currentCaptain && !msgData.isRead && currentChatMerchant !== msgData.from) {
                            
                            unreadMessagesByMerchant[msgData.from] = (unreadMessagesByMerchant[msgData.from] || 0) + 1;
                            
                            if(!initialLoad) {
                                // تشغيل التنبيه الصوتي بقوة
                                const snd = document.getElementById('msgSound');
                                snd.currentTime = 0; 
                                snd.play().catch(e=>console.log("Audio block:", e));
                                
                                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                                
                                Swal.fire({
                                    toast: true, position: 'top', icon: 'info',
                                    title: `رسالة جديدة من التاجر`,
                                    text: msgData.message.substring(0, 30) + '...',
                                    showConfirmButton: false, timer: 4000
                                });
                            }
                            
                            // تحديث الشاشة عشان النقط الحمرا تظهر
                            if(document.getElementById('orderDetailsModal').style.display === 'flex') {
                                const badge = document.getElementById(`badge-${msgData.from}`);
                                if(badge) { badge.innerText = unreadMessagesByMerchant[msgData.from]; badge.style.display = 'flex'; }
                            }
                            window.updateOuterBadges(msgData.from);
                        }
                    }
                });
                initialLoad = false;
            });
        }

        window.toggleShift = () => {
            isOnline = !isOnline;
            const btn = document.getElementById('shiftBtn'), dot = document.getElementById('statusDot'), txt = document.getElementById('statusTxt');
            
            // Warmup للصوت عشان يشتغل بعد كده بدون مشاكل
            const msgAudio = document.getElementById('msgSound');
            msgAudio.volume = 0; msgAudio.play().then(()=>{msgAudio.pause(); msgAudio.volume=1;}).catch(e=>{});

            if(isOnline) {
                btn.innerText = "إنهاء الوردية"; btn.style.background = "var(--primary-red)";
                dot.className = "pulse-online"; txt.innerText = "متصل بالرادار 🟢";
                Swal.fire({toast:true, position:'top', icon:'success', title:'وردية سعيدة يا بطل', showConfirmButton:false, timer:2000});
                
                const alertAud = document.getElementById('alertSound');
                alertAud.volume = 0; alertAud.play().then(()=>{alertAud.pause(); alertAud.volume=1;}).catch(e=>{});
                
                requestWakeLock();
                updateCourierStatus("online");
                startTracking();
            } else {
                btn.innerText = "بدء الوردية"; btn.style.background = "var(--primary-blue)";
                dot.className = ""; txt.innerText = "خارج الوردية";
                
                releaseWakeLock();
                if(watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                updateCourierStatus("offline");
            }
            loadRadar();
        };

        async function updateCourierStatus(status) {
            if(!currentCaptainId) return;
            try { await updateDoc(doc(db, "couriers", currentCaptainId), { status: status }); } catch(e) {}
        }

        function startTracking() {
            if(navigator.geolocation){
                watchId = navigator.geolocation.watchPosition(async (pos) => {
                    lat = pos.coords.latitude; lng = pos.coords.longitude;
                    loadRadar();
                    if(currentCaptainId && isOnline) {
                        try { await updateDoc(doc(db, "couriers", currentCaptainId), { "currentLocation.lat": lat, "currentLocation.lng": lng, "lastUpdated": new Date() }); } catch(e) {}
                    }
                }, err => {}, {enableHighAccuracy:true, maximumAge: 10000, timeout: 5000});
            } else { Swal.fire('خطأ', 'الـ GPS غير مدعوم', 'error'); }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2-lat1) * Math.PI/180; const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
        }

        function loadManifest() {
            const q = query(collection(db, "shipments"), where("courierName", "==", currentCaptain));
            onSnapshot(q, (snap) => {
                let html = ""; let count = 0;
                let docs = [];
                snap.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
                docs.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                docs.forEach(d => {
                    if(d.status !== "تم التسليم" && d.status !== "تمت التسوية" && d.status !== "مرتجع") {
                        count++;
                        globalOrdersData[d.id] = {id: d.id, source: 'manifest', ...d};
                        const awb = d.awb || "AXN...";
                        const timeStr = formatTime(d.timestamp);
                        
                        let unread = unreadMessagesByMerchant[d.merchantEmail] || 0;
                        let badgeDisplay = unread > 0 ? 'flex' : 'none';

                        html += `
                            <div class="compact-card" onclick="window.openOrderDetails('${d.id}', 'manifest')">
                                <div class="card-icon" style="color:var(--primary-blue); position:relative;">
                                    <i class="fa-solid fa-box-open"></i>
                                    <div class="card-chat-badge out-badge" data-merchant="${d.merchantEmail}" style="display:${badgeDisplay};">${unread}</div>
                                </div>
                                <div class="card-info">
                                    <h4 class="card-title">${awb}</h4>
                                    <p class="card-sub">${d.merchantEmail.split('@')[0]} ➡️ ${d.city}</p>
                                    <div class="card-time"><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                                </div>
                                <div class="card-price">${d.amount} ج.م</div>
                            </div>
                        `;
                    }
                });
                document.getElementById('manifestList').innerHTML = html || "<div style='text-align:center; margin-top:40px;'><i class='fa-solid fa-clipboard-check fa-3x' style='color:#E5E7EB; margin-bottom:15px;'></i><p style='color:#9CA3AF; font-weight:bold; font-size:16px;'>لا يوجد عهدة بوالص مفتوحة.</p></div>";
                const badge = document.getElementById('manifestBadge');
                if(count > 0) { badge.style.display = 'flex'; badge.innerText = count; } else { badge.style.display = 'none'; }
            });
        }

        function loadRadar() {
            onSnapshot(collection(db, "eshteryly_orders"), (snap) => {
                let radarHtml = "", myTasksHtml = "", newAlert = false, myTasksCount = 0;
                let availableOrders = [];

                snap.forEach(docSnap => {
                    const d = docSnap.data(), id = docSnap.id;
                    let distance = "--", distVal = 9999;
                    
                    if(lat && lng && d.address && d.address.includes('http')){
                        const match = d.address.match(/q=([\d\.-]+),([\d\.-]+)/);
                        if(match){
                            distVal = parseFloat(calculateDistance(lat, lng, parseFloat(match[1]), parseFloat(match[2])));
                            distance = distVal + " كم";
                            
                            if(distVal < 5 && !notifiedTasks.has(id) && d.status === "جاري البحث عن مندوب" && !ignored.has(id)) {
                                notifiedTasks.add(id); newAlert = true;
                            }
                        }
                    }

                    let typeIcon = "fa-cart-shopping", typeColor = "#10B981", typeBg = "#D1FAE5"; 
                    if (d.paymentMethod === 'pickup') { typeIcon = "fa-box"; typeColor = "#8B5CF6"; typeBg = "#E0E7FF"; } 
                    else if (d.type === 'radar' || (d.details && d.details.includes('بوليصة'))) { typeIcon = "fa-bolt"; typeColor = "#3B82F6"; typeBg = "#DBEAFE"; }
                    if (d.details && d.details.includes('كولد')) { typeIcon = "fa-snowflake"; typeColor = "#0EA5E9"; typeBg = "#E0F2FE"; }

                    let codText = "مجاني";
                    let matchAmt = d.details ? d.details.match(/تحصيل:\s*(\d+)/) : null;
                    if(matchAmt) codText = matchAmt[1] + " ج.م";

                    const timeStr = formatTime(d.timestamp);

                    globalOrdersData[id] = {id, source: 'radar', distance, typeIcon, typeColor, typeBg, codText, timeStr, ...d};

                    if(d.status === "جاري البحث عن مندوب" && isOnline && !ignored.has(id)){
                        availableOrders.push(globalOrdersData[id]);
                    }

                    if(d.status === "تم الاستلام بواسطة المندوب" && d.courierName === currentCaptain){
                        myTasksCount++;
                        
                        let unread = unreadMessagesByMerchant[d.merchantEmail] || 0;
                        let badgeDisplay = unread > 0 ? 'flex' : 'none';

                        myTasksHtml += `
                            <div class="compact-card" style="border-right-color: ${typeColor};" onclick="window.openOrderDetails('${id}', 'radar')">
                                <div class="card-icon" style="background:${typeBg}; color:${typeColor}; position:relative;">
                                    <i class="fa-solid ${typeIcon}"></i>
                                    <div class="card-chat-badge out-badge" data-merchant="${d.merchantEmail}" style="display:${badgeDisplay};">${unread}</div>
                                </div>
                                <div class="card-info">
                                    <h4 class="card-title">${d.merchantEmail.split('@')[0]}</h4>
                                    <p class="card-sub">${d.address.split(',')[0]}</p>
                                    <div class="card-time"><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                                </div>
                                <div class="card-price">${codText}</div>
                            </div>
                        `;
                    }
                });

                availableOrders.sort((a,b) => (a.distVal||999) - (b.distVal||999));
                availableOrders.forEach(o => {
                    radarHtml += `
                        <div class="compact-card" style="border-right-color: ${o.typeColor};" onclick="window.openOrderDetails('${o.id}', 'radar')">
                            <div class="card-icon" style="color:${o.typeColor};"><i class="fa-solid ${o.typeIcon}"></i></div>
                            <div class="card-info">
                                <h4 class="card-title">${o.merchantEmail.split('@')[0]} <span class="card-dist">${o.distance}</span></h4>
                                <p class="card-sub">${o.details}</p>
                                <div class="card-time"><i class="fa-regular fa-clock"></i> ${o.timeStr}</div>
                            </div>
                            <div class="card-price">${o.codText}</div>
                        </div>
                    `;
                });

                document.getElementById('radarList').innerHTML = isOnline ? (radarHtml || "<div style='text-align:center; margin-top:40px;'><i class='fa-solid fa-satellite-dish fa-3x' style='color:#E5E7EB; margin-bottom:15px;'></i><p style='color:#9CA3AF; font-weight:bold; font-size:16px;'>الرادار خالي.. جاري البحث</p></div>") : "<div style='text-align:center; margin-top:40px;'><i class='fa-solid fa-power-off fa-3x' style='color:#E5E7EB; margin-bottom:15px;'></i><p style='color:#9CA3AF; font-weight:bold; font-size:16px;'>الرادار في وضع السكون.</p></div>";
                document.getElementById('myTaskList').innerHTML = myTasksHtml || "<div style='text-align:center; margin-top:40px;'><i class='fa-solid fa-motorcycle fa-3x' style='color:#E5E7EB; margin-bottom:15px;'></i><p style='color:#9CA3AF; font-weight:bold; font-size:16px;'>لا توجد مهام مخطوفة</p></div>";
                
                const badge = document.getElementById('tasksBadge');
                if(myTasksCount > 0) { badge.style.display = 'flex'; badge.innerText = myTasksCount; } else { badge.style.display = 'none'; }

                if(newAlert && isOnline) {
                    const audio = document.getElementById('alertSound');
                    audio.play().catch(e => {});
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    if (Notification.permission === "granted") { new Notification("🚨 أكسون رادار", { body: "في أوردر جديد قريب منك، افتح التطبيق!" }); }
                }
            });
        }

            } else if (source === 'manifest') {
                contentHtml += `
                    <div class="detail-box">

                        <div style="margin-bottom:12px;"><b><i class="fa-solid fa-phone" style="color:var(--primary-blue); width:20px;"></i> التليفون:</b> <span dir="ltr" style="font-weight:900; color:var(--primary-red); font-size:16px;">${data.phone}</span></div>

                        <button class="btn-u btn-contact" onclick="window.openChatModal('${data.merchantEmail}')">

        window.claimOrder = async (id, linkedShipmentId) => {
            document.getElementById('orderDetailsModal').style.display = 'none';
            try {
                await updateDoc(doc(db, "eshteryly_orders", id), { status: "تم الاستلام بواسطة المندوب", courierName: currentCaptain, courierId: currentCaptainId });
                if(linkedShipmentId) { await updateDoc(doc(db, "shipments", linkedShipmentId), { status: "مع المندوب" }); }
                Swal.fire({toast:true, position:'top', icon:'success', title:'تم خطف المهمة بنجاح 🚀', showConfirmButton:false, timer:2000});
                switchTab('myTasksTab', document.querySelectorAll('.nav-item')[1]);
            } catch(e) { Swal.fire('خطأ', 'الصلاحيات لا تسمح أو المهمة اتخطفت من بطل تاني!', 'error'); }
        };

        window.completeTask = async (id, linkedShipmentId, source) => {
            document.getElementById('orderDetailsModal').style.display = 'none';
            const r = await Swal.fire({title:'تأكيد التسليم؟', text:'هل استلمت الكاش وتم تسليم الطرد؟', icon:'question', showCancelButton:true, confirmButtonText:'نعم ✅', cancelButtonText:'إلغاء', customClass: {confirmButton: 'btn-done', cancelButton: 'btn-ignore'}});
            if(r.isConfirmed) {
                if(source === 'radar') {
                    await updateDoc(doc(db, "eshteryly_orders", id), {status:"تم التسليم بنجاح"});
                    if(linkedShipmentId) await updateDoc(doc(db, "shipments", linkedShipmentId), {status: "تم التسليم"});
                } else if(source === 'manifest') {
                    await updateDoc(doc(db, "shipments", id), {status: "تم التسليم"});
                }
                
                try {
                    const cRef = doc(db, "couriers", currentCaptainId);
                    const cSnap = await getDoc(cRef);
                    let currentDeliveries = cSnap.data().successfulDeliveries || 0;
                    await updateDoc(cRef, { successfulDeliveries: currentDeliveries + 1 });
                } catch(e) {}

                Swal.fire({toast:true, position:'top', icon:'success', title:'عاش يا بطل، تمت المهمة بنجاح! 🏆', showConfirmButton:false, timer:2000});
            }
        };

        window.markReturn = async (id) => {
            document.getElementById('orderDetailsModal').style.display = 'none';
            const r = await Swal.fire({title:'سبب عدم التسليم؟', input: 'select', inputOptions: {'مؤجل': 'مؤجل لليوم التالي', 'مرتجع': 'رفض الاستلام (مرتجع)'}, showCancelButton:true});
            if(r.isConfirmed && r.value) {
                await updateDoc(doc(db, "shipments", id), {status: r.value});
                Swal.fire({toast:true, position:'top', icon:'info', title:'تم تحديث الحالة لـ ' + r.value, showConfirmButton:false, timer:2000});
            }
        };

        window.ignoreOrder = (id) => { 
            ignored.add(id); 
            document.getElementById('orderDetailsModal').style.display = 'none';
            loadRadar(); 
        };

        window.openNativeMap = (addr) => {
            const isAndroid = /android/i.test(navigator.userAgent || navigator.vendor || window.opera);
            if(isAndroid) { 
                window.open(`google.navigation:q=${addr}`, '_system'); 
            } else { 
                window.open(`https://maps.google.com/?q=${addr}`, '_blank'); 
            }
        };

        window.openChatModal = async (email) => {
            document.getElementById('orderDetailsModal').style.display = 'none';
            currentChatMerchant = email;
            
            // تصفير عداد الرسايل المقروءة أول ما يفتح الشات
            unreadMessagesByMerchant[email] = 0;
            window.updateOuterBadges(email); // إخفاء النقط الحمرا من الكروت
            
            document.getElementById('chatMerchantEmail').innerText = email.split('@')[0];
            document.getElementById('chatModal').style.display = 'flex';

            let phone = "مخفي"; let callBtnHtml = "";
            try {
                const pSnap = await getDoc(doc(db, "merchant_profiles", email));
                if(pSnap.exists() && pSnap.data().businessPhone) {
                    phone = pSnap.data().businessPhone;
                    callBtnHtml = `<button onclick="window.location.href='tel:${phone}'" style="width:100%; padding:15px; border-radius:15px; border:none; background:linear-gradient(135deg, #10B981, #059669); color:white; font-family:'Cairo'; font-weight:900; font-size:16px; box-shadow:0 5px 15px rgba(16,185,129,0.3); transition:0.3s;"><i class="fa-solid fa-phone"></i> اتصال بالتاجر: <span dir="ltr">${phone}</span></button>`;
                }
            } catch(err) {}
            document.getElementById('callMerchantBtnArea').innerHTML = callBtnHtml;

            if(chatUnsubscribe) chatUnsubscribe();
            
            chatUnsubscribe = onSnapshot(collection(db, "internal_chats"), (snap) => {
                let html = ""; let msgs = [];
                snap.forEach(doc => {
                    let md = doc.data();
                    msgs.push({id: doc.id, ...md});
                    
                    // تحويل الرسايل لمقروءة لو كانت جيالي وأنا فاتح الشات
                    if(md.to === currentCaptain && !md.isRead && md.from === email) {
                        updateDoc(doc.ref, { isRead: true }).catch(e=>{});
                    }
                });
                msgs.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

                msgs.forEach(m => {
                    if((m.from === currentCaptain && m.to === email) || (m.from === email && m.to === currentCaptain) || (m.to === currentCaptain && m.from === "admin@axon.com")) {
                        
                        let msgClass = "chat-other";
                        let senderName = "التاجر";
                        
                        if(m.from === currentCaptain) {
                            msgClass = "chat-mine";
                            senderName = "أنت";
                        } else if(m.from === "admin@axon.com" || m.from.includes('AXON')) {
                            msgClass = "chat-admin";
                            senderName = "🚨 الإدارة العليا";
                        }

                        html += `<div class="chat-bubble ${msgClass}"><b style="font-size:11px; opacity:0.7; display:block; margin-bottom:5px;">${senderName}</b>${m.message}</div>`;
                    }
                });
                
                const chatBox = document.getElementById('chatBoxCourier');
                chatBox.innerHTML = html || "<div style='text-align:center; color:#9CA3AF; margin-top:50px;'><i class='fa-solid fa-handshake fa-3x' style='margin-bottom:15px; color:#E5E7EB;'></i><br><span style='font-weight:bold; font-size:15px;'>ابدأ المحادثة مع التاجر.</span></div>";
                setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 100);
            });
        };

        window.closeChatModal = () => {
            document.getElementById('chatModal').style.display = 'none';
            if(chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
            currentChatMerchant = ""; 
        };

        window.sendChatMessage = async () => {
            const input = document.getElementById('chatInputCourier');
            const msg = input.value.trim();
            if(!msg || !currentChatMerchant) return;
            input.value = ""; 
            try { await addDoc(collection(db, "internal_chats"), { from: currentCaptain, to: currentChatMerchant, message: msg, timestamp: new Date(), isRead: false }); } catch(e) {}
        };

        window.logout = () => signOut(auth).then(() => window.location.reload());
        window.toggleTheme = () => document.body.classList.toggle('dark-mode');
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installPwaBtn');
            installBtn.style.display = 'inline-block';
            
            installBtn.addEventListener('click', async () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            });
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Captain SW Registered!'))
                    .catch(err => console.log('Captain SW Failed!'));
            });
        }
    </script>
</body>
</html>
