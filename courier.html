<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axon Captain | رادار الأبطال</title>
    
    <link rel="manifest" href="manifest-captain.json">
    <meta name="theme-color" content="#0B132B">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        :root { 
            --primary-blue: #0B132B; 
            --secondary-blue: #1C2541;
            --accent-blue: #3A506B;
            --primary-red: #D90429; 
            --secondary-red: #EF233C;
            --bg-color: #F8FAFC; 
            --white: #ffffff; 
            --dark-text: #0F172A; 
            --soft-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --uber-radius: 24px;
        }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); margin: 0; color: var(--dark-text); overflow-x: hidden; transition: background 0.3s ease; padding-bottom: 90px; }
        
        .app-container { max-width: 600px; margin: 0 auto; background: var(--bg-color); min-height: 100vh; position: relative;}
        
        /* شاشة الدخول الاحترافية */
        #loginSection { 
            background: linear-gradient(135deg, #0B132B, #1C2541); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 35px; 
            width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .login-card input {
            width: 100%; padding: 18px 20px; margin-bottom: 20px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.05); color: white; font-family: 'Cairo'; font-size: 16px; transition: all 0.3s;
        }
        .login-card input::placeholder { color: rgba(255,255,255,0.5); font-weight: 600; }
        .login-card input:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); transform: translateY(-2px); }
        
        .pass-wrapper { position: relative; width: 100%; }
        .pass-wrapper i { position: absolute; left: 20px; top: 20px; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 18px; transition: 0.3s; }
        .pass-wrapper i:hover { color: white; }

        .login-btn {
            width: 100%; background: linear-gradient(135deg, var(--secondary-red), var(--primary-red)); color: white; border: none; padding: 18px; 
            border-radius: 18px; font-weight: 900; font-size: 18px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 25px rgba(217, 4, 41, 0.4);
        }
        .login-btn:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(217, 4, 41, 0.3); }

        /* الهيدر العلوي */
        .app-header {
            background: var(--white); padding: 15px 25px; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.04);
            border-bottom-left-radius: var(--uber-radius); border-bottom-right-radius: var(--uber-radius); transition: background 0.3s;
        }
        .profile-area { display: flex; align-items: center; gap: 15px; }
        
        /* الصورة الشخصية */
        .avatar { 
            width: 55px; height: 55px; background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue)); 
            border-radius: 18px; display: flex; align-items: center; justify-content: center; color: white; 
            font-weight: 900; font-size:20px; box-shadow: 0 8px 15px rgba(11, 19, 43, 0.2);
            cursor: pointer; position: relative; overflow: hidden; background-size: cover; background-position: center; border: 2px solid var(--white);
            transition: transform 0.3s;
        }
        .avatar:active { transform: scale(0.92); }
        .avatar-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 22px; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; backdrop-filter: blur(2px);
        }
        .avatar:hover .avatar-overlay { opacity: 1; }

        .c-stars { color: #F59E0B; font-size: 13px; margin-top: 4px; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(245, 158, 11, 0.3);}
        .c-stars .empty-star { color: #E2E8F0; text-shadow: none; }

        /* شريط الحالة والوردية */
        .status-container {
            margin: 25px 20px; background: var(--white); padding: 18px 25px; border-radius: var(--uber-radius);
            display: flex; justify-content: space-between; align-items: center; box-shadow: var(--soft-shadow); transition: background 0.3s; border: 1px solid rgba(0,0,0,0.02);
        }
        .status-badge { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size:17px;}
        .pulse-online { width: 16px; height: 16px; background: #10B981; border-radius: 50%; box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        .shift-btn { background: var(--primary-blue); color: white; border: none; padding: 12px 28px; border-radius: 16px; font-weight: 900; font-family:'Cairo'; font-size:16px; box-shadow: 0 8px 20px rgba(11,19,43,0.2); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .shift-btn:active { transform: scale(0.92); }
        
        /* التابات السفلية (Bottom Navigation) */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12); border-radius: 30px; z-index: 1000; border: 1px solid rgba(255,255,255,0.4); transition: background 0.3s;
        }
        .nav-item {
            flex: 1; text-align: center; color: #94A3B8; font-size: 13px; font-weight: 800; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
        }
        .nav-item i { font-size: 24px; transition: 0.3s; }
        .nav-item.active { color: var(--primary-blue); }
        .nav-item.active i { transform: translateY(-6px) scale(1.15); color: var(--primary-red); }
        .nav-item.active span { transform: translateY(-2px); color: var(--primary-blue); }
        .nav-badge { position: absolute; top: -8px; right: 22px; background: var(--primary-red); color: white; border-radius: 50%; min-width: 20px; height: 20px; padding: 0 6px; font-size: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(217,4,41,0.5); display: none; font-weight: 900;}

        .page-tab { display: none; padding: 0 20px 20px 20px; animation: fadeInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .page-tab.active { display: block; }
        
        /* الكروت (Uber Style Cards) */
        .compact-card {
            background: var(--white); padding: 18px; border-radius: var(--uber-radius); display: flex; align-items: center; 
            justify-content: space-between; box-shadow: var(--soft-shadow); margin-bottom: 18px; cursor: pointer;
            border-right: 6px solid var(--primary-blue); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; overflow: visible;
        }
        .compact-card:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card-icon { width: 55px; height: 55px; border-radius: 16px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-left: 15px; flex-shrink: 0; transition: background 0.3s; position: relative;}
        .card-info { flex: 1; overflow: hidden;}
        .card-title { font-weight: 900; font-size: 17px; margin: 0; color: var(--dark-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px;}
        .card-sub { font-size: 14px; color: #64748B; margin: 6px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;}
        .card-time { font-size: 12px; color: #94A3B8; margin-top: 8px; display: flex; align-items: center; gap: 5px; font-weight: 700;}
        .card-price { font-weight: 900; color: var(--primary-red); font-size: 19px; text-align: left; white-space: nowrap; background: #FEF2F2; padding: 6px 12px; border-radius: 12px;}
        .card-dist { font-size: 11px; background: var(--primary-blue); color: white; padding: 4px 10px; border-radius: 10px; font-weight: 800; letter-spacing: 0.5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}

        .card-chat-badge {
            position: absolute; top: -8px; left: -8px; background: var(--primary-red); color: white; 
            min-width: 24px; height: 24px; border-radius: 50%; font-size: 12px; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; border: 3px solid var(--white); box-shadow: 0 4px 8px rgba(217,4,41,0.5); z-index: 10;
        }

        /* المودال - Bottom Sheet الاحترافي */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: flex-end; justify-content: center; z-index: 2000; padding: 0; transition: 0.3s;}
        .modal-content { background: var(--bg-color); padding: 35px 25px; border-radius: 35px 35px 0 0; width: 100%; max-width: 600px; position: relative; max-height: 90vh; overflow-y: auto; animation: slideUpSheet 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 -15px 40px rgba(0,0,0,0.2);}
        
        /* مؤشر السحب للمودال */
        .modal-content::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 50px; height: 5px; background: #CBD5E1; border-radius: 10px; }

        .close-btn { position: absolute; top: 20px; left: 20px; background: rgba(217, 4, 41, 0.08); border: none; font-size: 20px; cursor: pointer; color: var(--primary-red); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 10;}
        .close-btn:active { transform: scale(0.9); background: rgba(217, 4, 41, 0.15); }
        
        .detail-box { background: var(--white); padding: 20px; border-radius: var(--uber-radius); margin-bottom: 18px; box-shadow: var(--soft-shadow); border: 1px solid rgba(0,0,0,0.03);}
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px;}
        .btn-u { padding: 16px; border-radius: 18px; border: none; font-family: 'Cairo'; font-weight: 900; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative;}
        .btn-u:active { transform: scale(0.95); }
        .btn-claim { background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue)); color: white; grid-column: span 2; font-size: 18px; box-shadow: 0 10px 25px rgba(30,58,138,0.3);}
        .btn-ignore { background: #FEE2E2; color: var(--primary-red); }
        .btn-nav { background: #EFF6FF; color: var(--secondary-blue); }
        .btn-done { background: linear-gradient(135deg, #10B981, #059669); color: white; grid-column: span 2; font-size: 18px; box-shadow: 0 10px 25px rgba(16,185,129,0.3);}
        .btn-contact { background: #1E293B; color: white; grid-column: span 2; }
        
        .chat-notification-badge { position: absolute; top: -6px; right: -6px; background: var(--primary-red); color: white; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(217,4,41,0.5); font-weight: 900; border: 3px solid white; display: none; }

        /* الشات */
        .chat-bubble { padding: 14px 20px; border-radius: 24px; max-width: 82%; font-size: 15px; line-height: 1.5; box-shadow: 0 4px 10px rgba(0,0,0,0.04); margin-bottom: 12px; clear: both; font-weight: 700;}
        .chat-mine { background: #DCF8C6; float: left; border-bottom-left-radius: 6px; color: #064E3B; }
        .chat-other { background: #ffffff; float: right; border-bottom-right-radius: 6px; color: #1E293B; border: 1px solid #E2E8F0;}
        .chat-admin { background: #FEF2F2; float: right; border-bottom-right-radius: 6px; color: #991B1B; border: 1px solid #FECACA; }

        body.dark-mode { --bg-color: #0F172A; --white: #1E293B; --dark-text: #F8FAFC; --soft-shadow: 0 10px 30px rgba(0,0,0,0.4); --glass-bg: rgba(15, 23, 42, 0.85); }
        body.dark-mode .app-container { background: #0F172A; }
        body.dark-mode .app-header, body.dark-mode .status-container { border: 1px solid #334155; box-shadow: none;}
        body.dark-mode .bottom-nav { border: 1px solid #334155; box-shadow: 0 -5px 25px rgba(0,0,0,0.5);}
        body.dark-mode .compact-card, body.dark-mode .detail-box { background: #1E293B; border-color: #334155; border-right-color: var(--secondary-blue); box-shadow: none;}
        body.dark-mode .card-icon { background: #0F172A; color: var(--secondary-blue) !important;}
        body.dark-mode .card-sub { color: #94A3B8; }
        body.dark-mode .card-price { background: #450a0a; }
        body.dark-mode .modal-content { background: #0F172A; border-top: 1px solid #334155;}
        body.dark-mode .chat-other { background: #1E293B; color: #F8FAFC; border-color: #334155;}
        body.dark-mode .close-btn { background: rgba(217, 4, 41, 0.15); }
        body.dark-mode .btn-nav { background: #1e3a8a; color: #bfdbfe; }
        body.dark-mode .btn-ignore { background: #450a0a; color: #fca5a5; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); } 70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes slideUpSheet { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .swal2-container { font-family: 'Cairo', sans-serif !important; z-index: 99999 !important; }
        
        #installPwaBtn {
            display: none; background: linear-gradient(135deg, #10B981, #059669); border: none; color: white; padding: 8px 18px; border-radius: 14px; font-family: 'Cairo'; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 6px 15px rgba(16,185,129,0.3); animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-card">
            <h1 style="color:white; margin-bottom:5px; font-size:38px; letter-spacing:3px;">AXON</h1>
            <p style="color:rgba(255,255,255,0.8); font-size:16px; margin-bottom:35px; font-weight:800;">Captain Tactical App</p>
            <input type="email" id="cUser" placeholder="البريد الإلكتروني (الإيميل كامل)">
            
            <div class="pass-wrapper">
                <input type="password" id="cPass" placeholder="كلمة السر">
                <i class="fa-solid fa-eye" id="togglePasswordBtn" onclick="window.togglePassword()"></i>
            </div>

            <button class="login-btn" id="loginBtn" onclick="window.loginCourier()">تسجيل الدخول</button>
        </div>
    </div>

    <div class="app-container" id="appContent" style="display:none;">
        <div class="app-header">
            <div class="profile-area">
                <!-- زرار تغيير الصورة المخفي -->
                <input type="file" id="profilePicInput" accept="image/*" style="display:none;" onchange="window.uploadProfilePic(event)">
                <div class="avatar" id="cInitials" onclick="document.getElementById('profilePicInput').click()" title="اضغط لتغيير صورتك الشخصية">
                    AX
                    <div class="avatar-overlay"><i class="fa-solid fa-camera" style="font-size:14px; color:white;"></i></div>
                </div>
                <div>
                    <div style="font-size:13px; color:gray; font-weight:900; text-transform:uppercase;">كابتن أكسون</div>
                    <div style="font-size:20px; font-weight:900; line-height:1.2; color:var(--dark-text);" id="cDisplayName">...</div>
                    <div class="c-stars" id="cStars"></div>
                </div>
            </div>
            <div style="display:flex; gap:15px; align-items:center;">
                <button id="installPwaBtn"><i class="fa-solid fa-download"></i> تثبيت</button>
                <button onclick="window.toggleTheme()" style="background:none; border:none; color:var(--primary-blue); font-size:26px; transition:0.3s; cursor:pointer;"><i class="fa-solid fa-moon"></i></button>
                <button onclick="window.logout()" style="background:none; border:none; color:var(--primary-red); font-size:24px; transition:0.3s; cursor:pointer;"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <div class="status-container">
            <div class="status-badge">
                <div id="statusDot" class=""></div>
                <span id="statusTxt">خارج الوردية</span>
            </div>
            <button id="shiftBtn" class="shift-btn" onclick="window.toggleShift()">بدء الوردية</button>
        </div>

        <div id="radarTab" class="page-tab active">
            <h3 style="margin-bottom:20px; color:var(--primary-blue); font-size:18px; font-weight:900; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-satellite-dish fa-beat"></i> القريب منك (الرادار)</h3>
            <div id="radarList">
                <div style='text-align:center; margin-top:60px;'><i class='fa-solid fa-satellite-dish fa-4x' style='color:#E2E8F0; margin-bottom:20px;'></i><p style='color:#94A3B8; font-weight:800; font-size:17px;'>الرادار مغلق.. ابدأ الوردية يا بطل.</p></div>
            </div>
        </div>

        <div id="myTasksTab" class="page-tab">
            <h3 style="margin-bottom:20px; color:var(--primary-blue); font-size:18px; font-weight:900; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-motorcycle"></i> مهامي الحالية (مخطوفة)</h3>
            <div id="myTaskList">
                <div style='text-align:center; margin-top:60px;'><i class='fa-solid fa-motorcycle fa-4x' style='color:#E2E8F0; margin-bottom:20px;'></i><p style='color:#94A3B8; font-weight:800; font-size:17px;'>لا يوجد مهام رادار نشطة</p></div>
            </div>
        </div>

        <div id="manifestTab" class="page-tab">
            <h3 style="margin-bottom:20px; color:var(--primary-blue); font-size:18px; font-weight:900; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-file-invoice"></i> عهدة البوالص (المانيفست)</h3>
            <div id="manifestList">
                <div style='text-align:center; margin-top:60px;'><i class='fa-solid fa-clipboard-check fa-4x' style='color:#E2E8F0; margin-bottom:20px;'></i><p style='color:#94A3B8; font-weight:800; font-size:17px;'>لم يتم تعيين بوالص لك اليوم.</p></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('radarTab', this)">
                <i class="fa-solid fa-satellite-dish"></i>
                <span>الرادار</span>
            </div>
            <div class="nav-item" onclick="switchTab('myTasksTab', this)">
                <span class="nav-badge" id="tasksBadge">0</span>
                <i class="fa-solid fa-motorcycle"></i>
                <span>مهامي</span>
            </div>
            <div class="nav-item" onclick="switchTab('manifestTab', this)">
                <span class="nav-badge" id="manifestBadge">0</span>
                <i class="fa-solid fa-boxes-packing"></i>
                <span>المانيفست</span>
            </div>
        </div>
    </div>

    <!-- الأصوات -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="msgSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

    <div id="orderDetailsModal" class="modal">
        <div class="modal-content" id="orderDetailsContent"></div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content" style="height: 85vh; padding:25px 20px; background:var(--bg-color);">
            <button class="close-btn" onclick="window.closeChatModal()"><i class="fa-solid fa-chevron-down"></i></button>
            <h3 style="color:var(--primary-blue); margin-top:0; border-bottom:2px solid rgba(0,0,0,0.05); padding-bottom:20px; text-align:center; font-size:20px; font-weight:900;">
                <i class="fa-solid fa-comments"></i> مركز الدعم
            </h3>
            
            <div id="callMerchantBtnArea" style="margin-bottom: 20px;"></div>

            <div style="background: var(--white); border-radius: var(--uber-radius); border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column; flex: 1; overflow: hidden; box-shadow:var(--soft-shadow);">
                <div id="chatBoxCourier" style="flex: 1; padding: 20px; overflow-y: auto; display: block; background:var(--bg-color);"></div>

        function startTracking() {
            if(navigator.geolocation){
                window.watchId = navigator.geolocation.watchPosition(async (pos) => {
                    window.lat = pos.coords.latitude; window.lng = pos.coords.longitude;
                    loadRadar(); 
                    if(window.currentCaptainId && window.isOnline) {
                        try { await updateDoc(doc(db, "couriers", window.currentCaptainId), { "currentLocation.lat": window.lat, "currentLocation.lng": window.lng, "lastUpdated": new Date() }); } catch(e) {}

            } else { Swal.fire('خطأ', 'الـ GPS غير مدعوم', 'error'); }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2-lat1) * Math.PI/180; const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
        }

        function loadManifest() {
            const q = query(collection(db, "shipments"), where("courierName", "==", window.currentCaptain));
            onSnapshot(q, (snap) => {
                let html = ""; let count = 0;
                let docs = [];
                snap.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
                docs.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                docs.forEach(d => {
                    if(d.status !== "تم التسليم" && d.status !== "تمت التسوية" && d.status !== "مرتجع") {
                        count++;
                        window.globalOrdersData[d.id] = {id: d.id, source: 'manifest', ...d};
                        const awb = d.awb || "AXN...";
                        const timeStr = formatTime(d.timestamp);
                        let unread = window.unreadMessagesByOrder[d.id] || 0;
                        let badgeDisplay = unread > 0 ? 'flex' : 'none';

                        html += `
                            <div class="compact-card" onclick="window.openOrderDetails('${d.id}', 'manifest')">
                                <div class="card-icon" style="color:var(--primary-blue); position:relative;">
                                    <i class="fa-solid fa-box-open"></i>
                                    <div class="card-chat-badge out-badge" data-order="${d.id}" style="display:${badgeDisplay};">${unread}</div>
                                </div>
                                <div class="card-info">
                                    <h4 class="card-title">${awb}</h4>
                                    <p class="card-sub">${d.merchantEmail.split('@')[0]} ➡️ ${d.city}</p>
                                    <div class="card-time"><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                                </div>
                                <div class="card-price">${d.amount} ج.م</div>
                            </div>
                        `;
                    }
                });
                document.getElementById('manifestList').innerHTML = html || "<div style='text-align:center; margin-top:60px;'><i class='fa-solid fa-clipboard-check fa-4x' style='color:#E2E8F0; margin-bottom:20px;'></i><p style='color:#94A3B8; font-weight:800; font-size:17px;'>لم يتم تعيين بوالص لك اليوم.</p></div>";
                const badge = document.getElementById('manifestBadge');
                if(count > 0) { badge.style.display = 'flex'; badge.innerText = count; } else { badge.style.display = 'none'; }
            });
        }

        function loadRadar() {
            onSnapshot(collection(db, "eshteryly_orders"), (snap) => {
                let radarHtml = "", myTasksHtml = "", newAlert = false, myTasksCount = 0;
                let availableOrders = [];

                snap.forEach(docSnap => {
                    const d = docSnap.data(), id = docSnap.id;
                    let distance = "--", distVal = 9999;
                    
                    if(window.lat && window.lng && d.address && d.address.includes('http')){
                        const match = d.address.match(/q=([\d\.-]+),([\d\.-]+)/);
                        if(match){
                            distVal = parseFloat(calculateDistance(window.lat, window.lng, parseFloat(match[1]), parseFloat(match[2])));
                            distance = distVal + " كم";
                            
                            // ---- التنبيه الراداري الذكي ----
                            if(distVal < 5 && !window.notifiedTasks.has(id) && d.status === "جاري البحث عن مندوب" && !window.ignored.has(id)) {
                                window.notifiedTasks.add(id); 
                                newAlert = true;
                            }
                        }
                    }

                    let typeIcon = "fa-cart-shopping", typeColor = "#10B981", typeBg = "#D1FAE5"; 
                    if (d.paymentMethod === 'pickup') { typeIcon = "fa-box"; typeColor = "#8B5CF6"; typeBg = "#E0E7FF"; } 
                    else if (d.type === 'radar' || (d.details && d.details.includes('بوليصة'))) { typeIcon = "fa-bolt"; typeColor = "#3B82F6"; typeBg = "#DBEAFE"; }
                    if (d.details && d.details.includes('كولد')) { typeIcon = "fa-snowflake"; typeColor = "#0EA5E9"; typeBg = "#E0F2FE"; }

                    let codText = "مجاني";
                    let matchAmt = d.details ? d.details.match(/تحصيل:\s*(\d+)/) : null;
                    if(matchAmt) codText = matchAmt[1] + " ج.م";

                    const timeStr = formatTime(d.timestamp);

                    window.globalOrdersData[id] = {id, source: 'radar', distance, distVal, typeIcon, typeColor, typeBg, codText, timeStr, ...d};

                    if(d.status === "جاري البحث عن مندوب" && window.isOnline && !window.ignored.has(id)){
                        availableOrders.push(window.globalOrdersData[id]);

        function normalizeArabic(text) {
            if (!text) return "";
            return text.trim().replace(/\s+/g, ' ').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/[ىي]/g, 'ي'); 
        }

        // دالة حساب سعر الشحن
        function getRealShippingCost(cityName) {
            if(!cityName) return 85; 
            let normalizedInput = normalizeArabic(cityName);
            
            for (let zone of extraZonesList) {
                let parts = zone.split('-');
                let normalizedZone = normalizeArabic(zone);
                let subCityName = normalizeArabic(parts[1] || ""); 
                if (normalizedZone === normalizedInput || (subCityName && normalizedInput.includes(subCityName))) {
                    let parentGov = parts[0].trim();
                    let basePrice = Number(window.livePricesCache[parentGov]) || 85;
                    let extraFee = Number(window.livePricesCache[zone]) || 0;
                    return basePrice + extraFee; 
                }
            }
            for (let gov of governorates) {
                let normalizedGov = normalizeArabic(gov);
                if (normalizedInput.includes(normalizedGov) || normalizedGov.includes(normalizedInput)) {
                    return Number(window.livePricesCache[gov]) || 85;
                }
            }
            return 85; 
        }

            window.globalChatUnsubscribe = onSnapshot(chatQ, (snap) => {
                snap.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const msgData = change.doc.data();
                        const targetOrderId = msgData.orderId || 'general';
                        if(msgData.from !== window.currentCaptain && !msgData.isRead && window.currentChatOrderId !== targetOrderId) {
                            window.unreadMessagesByOrder[targetOrderId] = (window.unreadMessagesByOrder[targetOrderId] || 0) + 1;
                            if(!initialLoad) {
                                const snd = document.getElementById('msgSound');
                                snd.currentTime = 0; 
                                let playPromise = snd.play();
                                if (playPromise !== undefined) { playPromise.catch(e => {}); }
                                if(navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
                                Swal.fire({
                                    toast: true, position: 'top', icon: 'info',
                                    title: `رسالة بخصوص الطرد`,
                                    text: msgData.message.substring(0, 30) + '...',
                                    showConfirmButton: false, timer: 4000
                                });
                            }
                            window.updateOuterBadges(targetOrderId);
                        }
                    }
                });
                initialLoad = false;
            });
        }

        window.logout = () => signOut(auth).then(() => window.location.reload());
        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('axon_captain_theme', isDark ? 'dark' : 'light');
        };
        
        if(localStorage.getItem('axon_captain_theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installPwaBtn');
            installBtn.style.display = 'inline-block';
            installBtn.addEventListener('click', async () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            });
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Captain SW Registered!'))
                    .catch(err => console.log('Captain SW Failed!'));
            });
        }
    </script>
</body>
</html>
