<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axon Captain | رادار الأبطال</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { 
            --primary-blue: #1E3A8A; 
            --secondary-blue: #1E40AF;
            --primary-red: #D90429; 
            --bg-color: #F3F4F6; 
            --white: #ffffff; 
            --dark-text: #111827; 
            --soft-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); margin: 0; color: var(--dark-text); overflow-x: hidden; transition: 0.3s; }
        
        /* تظبيط العرض على الكمبيوتر */
        .app-container { max-width: 600px; margin: 0 auto; background: var(--bg-color); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative;}
        
        /* شاشة الدخول الاحترافية */
        #loginSection { 
            background: linear-gradient(135deg, var(--primary-blue), #000); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 30px; 
            width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.2);
        }
        .login-card input {
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: none; 
            background: white; font-family: 'Cairo'; font-size: 16px; text-align: center;
        }
        .login-btn {
            width: 100%; background: var(--primary-red); color: white; border: none; padding: 15px; 
            border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s;
        }

        /* الهيدر الجديد */
        .app-header {
            background: var(--white); padding: 15px 20px; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--soft-shadow);
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
        }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 45px; height: 45px; background: var(--primary-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        /* حالة الوردية (Floating Switch) */
        .status-container {
            margin: 20px; background: var(--white); padding: 20px; border-radius: 24px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: var(--soft-shadow);
        }
        .status-badge { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .pulse-online { width: 12px; height: 12px; background: #10B981; border-radius: 50%; animation: pulse 1.5s infinite; }
        
        /* الكروت المميزة */
        .section-title { padding: 0 25px; font-size: 18px; font-weight: 900; color: var(--primary-blue); margin-top: 25px; }
        .order-card {
            background: var(--white); margin: 15px 20px; padding: 20px; border-radius: 20px;
            box-shadow: var(--soft-shadow); position: relative; transition: 0.3s; overflow: hidden;
        }
        .order-card:active { transform: scale(0.98); }
        
        /* شريط اللون الجانبي لكل نوع طرد */
        .card-border { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; }

        .dist-tag {
            position: absolute; top: 20px; left: 20px; background: #F3F4F6; color: var(--primary-blue);
            padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 900;
        }
        .task-badge { 
            display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 12px; 
            font-weight: bold; margin-bottom: 10px; 
        }
        
        .merchant-name { font-size: 17px; font-weight: 900; margin: 0 0 5px 0; }
        .location-text { font-size: 14px; color: #6B7280; margin: 5px 0 15px 0; display: flex; align-items: center; gap: 5px; line-height: 1.5; }

        /* أزرار الأكشن السلسة */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-u {
            padding: 12px; border-radius: 12px; border: none; font-family: 'Cairo'; 
            font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .btn-claim { background: var(--primary-blue); color: white; grid-column: span 2; font-size: 16px; font-weight: 900;}
        .btn-details { background: #F3F4F6; color: var(--dark-text); }
        .btn-ignore { background: #FEE2E2; color: var(--primary-red); }
        .btn-nav { background: #E0E7FF; color: var(--primary-blue); }
        .btn-done { background: #D1FAE5; color: #065F46; }
        .btn-contact { background: #f3f4f6; color: #374151; grid-column: span 2; }
        .btn-contact:hover { background: #e5e7eb; }

        /* Dark Mode */
        body.dark-mode { --bg-color: #000; --white: #111827; --dark-text: #F9FAFB; --soft-shadow: none; }
        body.dark-mode .app-container { background: #000; }
        body.dark-mode .app-header, body.dark-mode .order-card, body.dark-mode .status-container { border: 1px solid #1F2937; }
        body.dark-mode .btn-details, body.dark-mode .btn-contact { background: #1F2937; color: #fff; }
        body.dark-mode .dist-tag { background: #1F2937; color: #fff; }

        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }
        
        .swal2-container { font-family: 'Cairo', sans-serif !important; }
    </style>
</head>
<body>

    <!-- قسم الدخول -->
    <div id="loginSection">
        <div class="login-card">
            <h1 style="color:white; margin-bottom:5px;">AXON</h1>
            <p style="color:rgba(255,255,255,0.7); font-size:14px; margin-bottom:30px;">تطبيق الكابتن - النسخة التكتيكية</p>
            <input type="text" id="cUser" placeholder="كود المحارب (مثال: ahmed)">
            <input type="password" id="cPass" placeholder="كلمة السر">
            <button class="login-btn" onclick="window.loginCourier()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="app-container" id="appContent" style="display:none;">
        <div class="app-header">
            <div class="profile-area">
                <div class="avatar" id="cInitials">AX</div>
                <div>
                    <div style="font-size:12px; color:gray;">كابتن أكسون</div>
                    <div style="font-size:15px; font-weight:900;" id="cDisplayName">...</div>
                </div>
            </div>
            <div style="display:flex; gap:15px;">
                <button onclick="window.toggleTheme()" style="background:none; border:none; color:var(--primary-blue); font-size:22px;"><i class="fa-solid fa-moon"></i></button>
                <button onclick="window.logout()" style="background:none; border:none; color:var(--primary-red); font-size:20px;"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <div class="status-container">
            <div class="status-badge">
                <div id="statusDot" class=""></div>
                <span id="statusTxt">خارج الوردية</span>
            </div>
            <button id="shiftBtn" onclick="window.toggleShift()" style="background:var(--primary-blue); color:white; border:none; padding:10px 25px; border-radius:12px; font-weight:bold; font-family:'Cairo';">بدء الوردية</button>
        </div>

        <div class="section-title">القريب منك (الرادار)</div>
        <div id="radarList">
            <p style="text-align:center; color:gray; margin-top:30px;">الرادار مغلق.. ابدأ الوردية يا بطل.</p>
        </div>

        <div class="section-title">مهامي الحالية</div>
        <div id="myTaskList">
            <p style="text-align:center; color:gray; margin-top:20px;">لا يوجد مهام نشطة</p>
        </div>
    </div>

    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const app = initializeApp({
            apiKey: "AIzaSyBuGdQQZ2lDu73W7wP3na45rlhiMXjaqGw",
            authDomain: "axon-express-2f534.firebaseapp.com",
            projectId: "axon-express-2f534",
            storageBucket: "axon-express-2f534.firebasestorage.app",
            messagingSenderId: "958528400260",
            appId: "1:958528400260:web:504ae94f3ef2225b928bd1"
        });
        
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentCaptain = "", isOnline = false, watchId = null, lat = null, lng = null, ignored = new Set();

        onAuthStateChanged(auth, (user) => {
            if (user && user.email.includes("@courier.axon.com")) {
                currentCaptain = user.email.split('@')[0];
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('cDisplayName').innerText = currentCaptain;
                document.getElementById('cInitials').innerText = currentCaptain.substring(0, 2).toUpperCase();
                startTracking();
            } else {
                document.getElementById('loginSection').style.display = 'flex';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        window.loginCourier = async () => {
            const u = document.getElementById('cUser').value.trim().toLowerCase();
            const p = document.getElementById('cPass').value;
            if(!u || !p) return Swal.fire('بيانات ناقصة', 'أدخل الكود والباسورد', 'warning');
            try { 
                await signInWithEmailAndPassword(auth, u + "@courier.axon.com", p); 
            } catch(e) { 
                Swal.fire('خطأ', 'بيانات غير صحيحة', 'error'); 
            }
        };

        window.toggleShift = () => {
            isOnline = !isOnline;
            const btn = document.getElementById('shiftBtn'), dot = document.getElementById('statusDot'), txt = document.getElementById('statusTxt');
            if(isOnline) {
                btn.innerText = "إنهاء الوردية"; 
                btn.style.background = "var(--primary-red)";
                dot.className = "pulse-online"; 
                txt.innerText = "متصل بالرادار 🟢";
                Swal.fire({toast:true, position:'top', icon:'success', title:'وردية سعيدة يا بطل', showConfirmButton:false, timer:2000});
                
                // تشغيل الصوت في الخلفية لأول مرة عشان المتصفح يسمح بيه بعدين
                const audio = document.getElementById('alertSound');
                audio.volume = 0; audio.play().catch(e=>{}); setTimeout(()=>{audio.pause(); audio.volume = 1;}, 100);
                
            } else {
                btn.innerText = "بدء الوردية"; 
                btn.style.background = "var(--primary-blue)";
                dot.className = ""; 
                txt.innerText = "خارج الوردية";
            }
            loadRadar();
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2-lat1) * Math.PI/180; 
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
        }

        function loadRadar() {
            onSnapshot(collection(db, "eshteryly_orders"), (snap) => {
                let radarHtml = "", myTasksHtml = "", nearbyFound = false;
                let availableOrders = [];

                snap.forEach(docSnap => {
                    const d = docSnap.data(), id = docSnap.id;
                    let distance = "--", distVal = 9999;
                    
                    if(lat && lng && d.address && d.address.includes('maps.google.com')){
                        const match = d.address.match(/q=([\d\.-]+),([\d\.-]+)/);
                        if(match){
                            distVal = parseFloat(calculateDistance(lat, lng, parseFloat(match[1]), parseFloat(match[2])));
                            distance = distVal + " كم";
                            if(distVal < 2) nearbyFound = true;
                        }
                    }

                    // --- تحديد ألوان وأنواع المهام بذكاء ---
                    let typeIcon = "🛒", typeText = "اشتريلي وتسوق", typeColor = "#10B981", bgColor = "#D1FAE5"; 
                    if (d.paymentMethod === 'pickup') { 
                        typeIcon = "📦"; typeText = "أمر بيكب واستلام"; typeColor = "#8B5CF6"; bgColor = "#EDE9FE"; 
                    } else if (d.type === 'radar' || (d.details && d.details.includes('بوليصة'))) { 
                        typeIcon = "🚚"; typeText = "توصيل بوليصة مباشر"; typeColor = "#3B82F6"; bgColor = "#DBEAFE"; 
                    }
                    if (d.details && d.details.includes('كولد')) { 
                        typeIcon = "🥶"; typeText = "شحن كولد فريش"; typeColor = "#0EA5E9"; bgColor = "#E0F2FE"; 
                    }

                    if(d.status === "جاري البحث عن مندوب" && isOnline && !ignored.has(id)){
                        availableOrders.push({id, ...d, distVal, distance, typeIcon, typeText, typeColor, bgColor});
                    }

                    if(d.status === "تم الاستلام بواسطة المندوب" && d.courierName === currentCaptain){
                        myTasksHtml += `
                            <div class="order-card">
                                <div class="card-border" style="background: ${typeColor};"></div>
                                <span class="task-badge" style="background: ${bgColor}; color: ${typeColor};"><i class="fa-solid ${typeIcon === '🛒' ? 'fa-cart-shopping' : typeIcon === '📦' ? 'fa-box' : 'fa-truck-fast'}"></i> ${typeText}</span>
                                <h4 class="merchant-name">${d.merchantEmail.split('@')[0]}</h4>
                                <div class="location-text"><i class="fa-solid fa-location-dot"></i> ${d.address.substring(0,40)}...</div>
                                <div class="btn-grid">
                                    <button class="btn-u btn-nav" onclick="window.openMap('${encodeURIComponent(d.address)}')"><i class="fa-solid fa-location-arrow"></i> ملاحة</button>
                                    <button class="btn-u btn-done" onclick="window.completeTask('${id}', '${d.linkedShipmentId || ''}')"><i class="fa-solid fa-check"></i> تسليم</button>
                                    <button class="btn-u btn-contact" onclick="window.contactMerchant('${d.merchantEmail}')"><i class="fa-solid fa-comments"></i> بيانات التاجر / محادثة</button>
                                </div>
                            </div>
                        `;
                    }
                });

                availableOrders.sort((a,b) => a.distVal - b.distVal);
                availableOrders.forEach(o => {
                    radarHtml += `
                        <div class="order-card">
                            <div class="card-border" style="background: ${o.typeColor};"></div>
                            <div class="dist-tag">${o.distance}</div>
                            <span class="task-badge" style="background: ${o.bgColor}; color: ${o.typeColor};">${o.typeIcon} ${o.typeText}</span>
                            <h4 class="merchant-name">${o.merchantEmail.split('@')[0]}</h4>
                            <p style="font-size:13px; color:gray; margin-top:5px; margin-bottom:15px;">المنطقة: ${o.address.split(',')[0]}</p>
                            <div class="btn-grid">
                                <button class="btn-u btn-claim" onclick="window.claimOrder('${o.id}', '${o.linkedShipmentId || ''}')">خطف المهمة 🚀</button>
                                <button class="btn-u btn-details" onclick="window.showDetails('${o.details}')">تفاصيل</button>
                                <button class="btn-u btn-ignore" onclick="window.ignoreOrder('${o.id}')">تجاهل</button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('radarList').innerHTML = isOnline ? (radarHtml || "<p style='text-align:center; padding:20px; color:gray;'>الرادار خالي.. جاري البحث</p>") : "<p style='text-align:center; padding:20px; color:gray;'>الرادار في وضع السكون.</p>";
                document.getElementById('myTaskList').innerHTML = myTasksHtml || "<p style='text-align:center; padding:20px; color:gray;'>لا توجد مهام حالياً</p>";
                
                // تشغيل الصوت لو في أوردر جديد والمندوب أونلاين
                if(nearbyFound && isOnline) {
                    const audio = document.getElementById('alertSound');
                    audio.play().catch(e => console.log("المتصفح منع الصوت التلقائي"));
                }
            });
        }

        window.showDetails = (info) => Swal.fire({title:'تفاصيل المهمة', text:info, icon:'info', confirmButtonText:'علم'});
        
        window.claimOrder = async (id, linkedShipmentId) => {
            try {
                await updateDoc(doc(db, "eshteryly_orders", id), {
                    status: "تم الاستلام بواسطة المندوب", 
                    courierName: currentCaptain
                });
                
                // لو المهمة دي مربوطة ببوليصة شحن، نحدث البوليصة كمان
                if(linkedShipmentId) {
                    await updateDoc(doc(db, "shipments", linkedShipmentId), {
                        status: "مع المندوب: " + currentCaptain,
                        courierName: currentCaptain
                    });
                }
                
                Swal.fire({toast:true, position:'top', icon:'success', title:'تم خطف المهمة بنجاح', showConfirmButton:false, timer:2000});
            } catch(e) { 
                Swal.fire('سبقك بطل آخر', 'المهمة مقتنصة بالفعل', 'error'); 
            }
        };

        window.contactMerchant = async (email) => {
            try {
                // الكود ده كان ناقص استدعاء getDoc وتم حله
                const pSnap = await getDoc(doc(db, "merchant_profiles", email));
                const phone = pSnap.exists() ? (pSnap.data().businessPhone || pSnap.data().phone || "غير مسجل") : "غير مسجل";
                
                Swal.fire({
                    title: 'تواصل مع التاجر',
                    html: `<b>رقم الهاتف:</b> <span dir="ltr">${phone}</span><br><br><button onclick="window.location.href='tel:${phone}'" class="btn-u btn-nav" style="width:100%; padding:10px; border-radius:10px; border:none; font-weight:bold;">اتصال هاتفى <i class="fa-solid fa-phone"></i></button>`,
                    input: 'textarea',
                    inputPlaceholder: 'اكتب رسالة شات داخلية هنا...',
                    showCancelButton: true,
                    confirmButtonText: 'إرسال رسالة',
                    cancelButtonText: 'إلغاء'
                }).then(async (res) => {
                    if(res.isConfirmed && res.value){
                        await addDoc(collection(db, "internal_chats"), { 
                            from: currentCaptain, 
                            to: email, 
                            message: res.value, 
                            timestamp: new Date() 
                        });
                        Swal.fire('تم الإرسال', 'رسالتك وصلت للتاجر', 'success');
                    }
                });
            } catch(err) {
                console.error(err);
                Swal.fire('خطأ', 'حدثت مشكلة في سحب بيانات التاجر', 'error');
            }
        };

        function startTracking() {
            if(navigator.geolocation){
                watchId = navigator.geolocation.watchPosition(pos => {
                    lat = pos.coords.latitude; 
                    lng = pos.coords.longitude;
                    loadRadar();
                }, err => console.log(err), {enableHighAccuracy:true});
            }
        }

        window.openMap = (addr) => window.open(`https://www.google.com/maps/search/?api=1&query=${addr}`, '_blank');
        window.logout = () => signOut(auth).then(() => window.location.reload());
        window.toggleTheme = () => document.body.classList.toggle('dark-mode');
        window.ignoreOrder = (id) => { ignored.add(id); loadRadar(); };
        
        window.completeTask = async (id, linkedShipmentId) => {
            const r = await Swal.fire({title:'تأكيد الاستلام؟', text:'هل قمت بتنفيذ المهمة بنجاح؟', icon:'question', showCancelButton:true, confirmButtonText:'نعم، تمت', cancelButtonText:'إلغاء'});
            if(r.isConfirmed) {
                await updateDoc(doc(db, "eshteryly_orders", id), {status:"تم التسليم بنجاح"});
                if(linkedShipmentId) {
                    await updateDoc(doc(db, "shipments", linkedShipmentId), {status: "تم التسليم"});
                }
                Swal.fire({toast:true, position:'top', icon:'success', title:'عاش يا بطل', showConfirmButton:false, timer:2000});
            }
        };

    </script>
</body>
</html>
