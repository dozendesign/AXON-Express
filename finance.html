<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخزينة المركزية | Axon Express</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #111; border-bottom: 3px solid #E1E715; padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo img { height: 35px; object-fit: contain; }
        .container { padding: 20px; max-width: 1300px; margin: 0 auto; }
        .filter-bar { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        select { padding: 8px 12px; border-radius: 8px; border: 2px solid #111; font-family: 'Cairo'; font-weight: bold; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { background: #e2e8f0; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #111; color: #E1E715; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid #111; }
        .stat-card.red { border-bottom-color: #800020; }
        .stat-card.green { border-bottom-color: #10B981; }
        .value { font-size: 26px; font-weight: 900; margin-top: 5px; }
        .table-responsive { overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 25px; }
        table { width: 100%; min-width: 800px; border-collapse: collapse; }
        th { background: #111; color: #E1E715; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        button { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 2px; }
        .btn-view { background: #17a2b8; color: white; }
        .btn-settle { background: #10B981; color: white; }
        .btn-print { background: #111; color: #E1E715; }
        .btn-danger { background: #800020; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; max-width: 900px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; font-size: 24px; cursor: pointer; color: #800020; }
        .summary-box { background: #f4f4f4; padding: 10px; border-radius: 8px; display: flex; justify-content: space-around; margin: 15px 0; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; top: 0; left: 0; width: 100%; }
            .print-table { font-size: 8px; border-collapse: collapse; width: 100%; }
            .print-table td, .print-table th { border: 1px solid #000; padding: 2px; }
        }
    </style>
</head>
<body>
<header>
    <div class="logo"><img src="WhatsApp%20Image%202026-04-28%20at%209.22.48%20PM.png" alt="Logo"><span>AXON EXPRESS | FINANCE</span></div>
    <div>
        <button onclick="location.href='admin.html'" style="background:transparent;border:1px solid #E1E715;color:#E1E715;">رجوع للإدارة</button>
        <button onclick="document.body.classList.toggle('dark-mode')" style="background:none;border:none;color:#E1E715;">🌙</button>
        <button onclick="window.logout()" style="background:#800020;color:white;border:none;">خروج</button>
    </div>
</header>
<div class="container">
    <div class="filter-bar">
        <i class="fa-solid fa-city"></i> <span>مراجعة فرع:</span>
        <select id="branchSelect" onchange="window.refreshData()">
            <option value="all">الجمهورية (الكل)</option>
            <option value="القاهرة">القاهرة</option><option value="الجيزة">الجيزة</option><option value="الإسكندرية">الإسكندرية</option>
            <option value="الدقهلية">الدقهلية</option><option value="الغربية">الغربية</option><option value="المنوفية">المنوفية</option>
            <option value="الشرقية">الشرقية</option><option value="القليوبية">القليوبية</option><option value="البحيرة">البحيرة</option>
            <option value="كفر الشيخ">كفر الشيخ</option><option value="دمياط">دمياط</option><option value="الإسماعيلية">الإسماعيلية</option>
            <option value="بورسعيد">بورسعيد</option><option value="السويس">السويس</option><option value="مرسى مطروح">مرسى مطروح</option>
            <option value="شمال سيناء">شمال سيناء</option><option value="جنوب سيناء">جنوب سيناء</option><option value="البحر الأحمر">البحر الأحمر</option>
            <option value="الفيوم">الفيوم</option><option value="بني سويف">بني سويف</option><option value="المنيا">المنيا</option>
            <option value="أسيوط">أسيوط</option><option value="سوهاج">سوهاج</option><option value="قنا">قنا</option>
            <option value="الأقصر">الأقصر</option><option value="أسوان">أسوان</option><option value="الوادي الجديد">الوادي الجديد</option>
        </select>
    </div>
    <div id="loading" style="text-align:center;padding:50px;"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
    <div id="dashboard" style="display:none;">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('overview')">الموقف العام</button>
            <button class="tab-btn" onclick="showTab('couriers')">عهد الكباتن</button>
            <button class="tab-btn" onclick="showTab('merchants')">تسويات التجار</button>
            <button class="tab-btn" onclick="showTab('expenses')">المصروفات</button>
        </div>
        <div id="overview" class="tab-content active">
            <div class="stats">
                <div class="stat-card"><h3>إجمالي العهد المحصلة</h3><div class="value" id="statTotalCash">0</div></div>
                <div class="stat-card red"><h3>مستحقات التجار (صافية)</h3><div class="value" id="statNetDues">0</div></div>
                <div class="stat-card green"><h3>أرباح الشركة (شحن+وزن+تأمين)</h3><div class="value" id="statProfit">0</div></div>
